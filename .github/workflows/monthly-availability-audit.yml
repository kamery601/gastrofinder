# Monthly activity audit: re-checks every listed place in the Podhale
# localities (dead listings, winter-only stands, dormant places) and commits
# fresh verdicts to data/availability-checks.json. The push to main makes
# Railway redeploy automatically, so the app always serves current verdicts.
#
# Runs on the 1st of every month (which also covers 1 Dec = winter season
# start and 1 Apr = end), and can be started by hand from the Actions tab.
# If Google blocks the key or the lists look broken, the script exits with an
# error: nothing is committed, old verdicts stay, and GitHub emails the owner.

name: Monthly availability audit

on:
  schedule:
    - cron: '0 4 1 * *'   # 04:00 UTC = 06:00 Polish summer time / 05:00 winter time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: availability-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run audit (fresh data, no cache)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node scripts/audit-availability.js --write-checks data/availability-checks.json

      - name: Tests must stay green with the new verdicts
        run: npm test

      - name: Commit and push new verdicts
        run: |
          if git diff --quiet -- data/availability-checks.json; then
            echo "No changes in verdicts."
            exit 0
          fi
          git config user.name "gastrofinder-audit-bot"
          git config user.email "kamery601@users.noreply.github.com"
          git add data/availability-checks.json
          git commit -m "chore: monthly availability audit $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
